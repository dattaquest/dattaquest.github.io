name: Verificar integración oficial de radicación (experimental)
on:
  pull_request:
    paths:
      - 'otros-servicios/radicacion/verificar.html'
      - 'otros-servicios/radicacion/css/verificar.css'
      - 'tests/probar_radicacion_integrada.mjs'
      - '.github/workflows/probar-radicacion-integrada.yml'
permissions:
  contents: read
jobs:
  formulario:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/probar_radicacion_integrada.mjs
