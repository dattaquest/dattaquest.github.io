name: Inspección técnica del formulario público DNRPA
on:
  pull_request:
    paths:
      - '.github/workflows/inspeccionar-dnrpa.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Leer únicamente el formulario público (sin enviar datos ni verificar códigos)
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re
          from html.parser import HTMLParser
          url="https://www.dnrpa.gov.ar/portal_dnrpa/radicacion2.php"
          req=urllib.request.Request(url,headers={"Accept":"text/html"})
          with urllib.request.urlopen(req,timeout=20) as r:
              print("HTTP",r.status,r.url)
              if r.url!=url: raise RuntimeError("URL modificada; revisar")
              source=r.read(600000).decode("utf-8",errors="replace")
          class Form(HTMLParser):
              def __init__(self):
                  super().__init__(); self.form=False; self.script=False; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="form":
                      self.form=True
                      print("FORM", {k:a[k] for k in ("id","name","action","method","target","onsubmit") if k in a})
                  if self.form and tag in ("input","button","img","select","a"):
                      print(tag, {k:a[k] for k in ("id","name","type","src","href","onclick","onchange","maxlength","target","action") if k in a})
                  if tag=="script":
                      if a.get("src"):print("SCRIPT URL",a["src"])
                      self.script=True
              def handle_endtag(self,tag):
                  if tag=="form":self.form=False
                  if tag=="script":self.script=False
              def handle_data(self,data):
                  if self.script: self.scripts.append(data)
          parser=Form();parser.feed(source)
          for s in parser.scripts:
              if re.search(r"radic|consult|verificador|captcha|window.open|dominio",s,re.I):
                  # El código público del formulario describe el mecanismo de envío.
                  # No se imprimen cookies, respuestas de usuarios ni imágenes del verificador.
                  print("PUBLIC SCRIPT",s[:16000])
          PY
