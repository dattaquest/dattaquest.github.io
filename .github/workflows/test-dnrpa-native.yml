name: Probar conector nativo DNRPA
on:
  pull_request:
    paths:
      - 'backend-dnrpa/**'
      - 'otros-servicios/radicacion/nativa.html'
      - 'otros-servicios/radicacion/js/dnrpa*'
      - 'otros-servicios/radicacion/css/dnrpa.css'
      - 'tests/test_dnrpa_native.mjs'
      - '.github/workflows/test-dnrpa-native.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_dnrpa_native.mjs
      - run: node --check otros-servicios/radicacion/js/dnrpa.js && node --check backend-dnrpa/worker.mjs
      - name: Comprobar sólo el formulario oficial y la existencia de sesión (sin resolver código)
        run: |
          node --input-type=module <<'JS'
          import {challenge} from './backend-dnrpa/provider.mjs';
          import {FORM,parseForm} from './backend-dnrpa/provider.mjs';
          const r=await fetch(FORM,{redirect:'manual',cache:'no-store',headers:{Accept:'text/html'},signal:AbortSignal.timeout(14000)});
          const names=r.headers.getSetCookie().map(v=>({
            nombre:v.split('=',1)[0],path:/;\s*path=([^;]+)/i.exec(v)?.[1]??'(default)',
            domain:/;\s*domain=([^;]+)/i.exec(v)?.[1]??'(host)',
            expirada:/;\s*max-age=0(?:;|$)/i.test(v)
          }));
          console.log(JSON.stringify({http:r.status,cookies:names,cache:r.headers.get('cache-control'),age:r.headers.get('age')}));
          if(r.status!==200)throw Error('Formulario no accesible');
          parseForm(await r.text());
          console.log('Estructura e imagen oficiales presentes; no se imprime la imagen ni se envían datos.');
          if(!names.length)throw Error('DNRPA no entregó cookies de sesión; no se enviará consulta.');
          JS
      - name: Verificar si existe configuración de despliegue ya disponible
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "Configuración Cloudflare presente (no se muestran credenciales)."
          else
            echo "Configuración Cloudflare ausente."
          fi
