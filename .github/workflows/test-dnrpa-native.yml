name: Probar conector nativo DNRPA
on:
  pull_request:
    paths:
      - 'backend-dnrpa/**'
      - 'otros-servicios/radicacion/nativa.html'
      - 'otros-servicios/radicacion/js/dnrpa*'
      - 'otros-servicios/radicacion/css/dnrpa.css'
      - 'tests/test_dnrpa_native.mjs'
      - 'tests/test_dnrpa_browser.mjs'
      - '.github/workflows/test-dnrpa-native.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_dnrpa_native.mjs
      - run: node --check otros-servicios/radicacion/js/dnrpa.js && node --check backend-dnrpa/worker.mjs
      - name: Probar el formulario nativo con respuestas simuladas
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
          node tests/test_dnrpa_browser.mjs
      - name: Comprobar la carga del verificador oficial
        run: |
          node --input-type=module <<'JS'
          import {challenge} from './backend-dnrpa/provider.mjs';
          const {cookie} = await challenge();
          console.log('Formulario e imagen recibidos. Cookie aplicable:', Boolean(cookie));
          JS
      - name: Verificar si existe configuración de despliegue ya disponible
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "Configuración Cloudflare presente (no se muestran credenciales)."
          else
            echo "Configuración Cloudflare ausente."
          fi
      - name: Capturas del formulario nativo con datos sintéticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radicacion-nativa-capturas
          path: test-results/radicacion-nativa-*.png
          if-no-files-found: ignore
          retention-days: 7
