name: Importar numeracion ENACOM

on:
  workflow_dispatch:
    inputs:
      xls_url:
        description: 'URL HTTPS DIRECTA al XLS/XLSX/CSV publicado en enacom.gob.ar'
        required: true
        type: string
  schedule:
    - cron: '10 6 * * 1'

permissions:
  contents: write

concurrency:
  group: dattaquest-enacom
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    env:
      ENACOM_XLS_URL: ${{ github.event.inputs.xls_url || vars.ENACOM_XLS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: herramientas/requirements.txt
      - name: No publicar si falta la URL configurada
        run: |
          if [ -z "$ENACOM_XLS_URL" ]; then
            echo 'Falta ingresar xls_url al ejecutar manualmente, o configurar la variable ENACOM_XLS_URL del repositorio.'
            exit 1
          fi
      - name: Instalar lector XLS
        run: python -m pip install -r herramientas/requirements.txt
      - name: Descargar el fichero oficial
        run: |
          python herramientas/descargar_enacom.py --url "$ENACOM_XLS_URL" --salida /tmp/datta-enacom.xls
      - name: Importar numeracion y prefijos
        run: |
          python herramientas/actualizar_enacom.py --archivo /tmp/datta-enacom.xls --fuente https://www.enacom.gob.ar/asignaciones-a-la-fecha_p445
      - name: Verificar la salida antes de publicarla
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('otros-servicios')
          a=json.loads((base/'prestadores/data/asignaciones.json').read_text())
          p=json.loads((base/'prefijos/data/prefijos.json').read_text())
          assert len(a['bloques'])>=1000 and len(p)>=30
          print(len(a['bloques']), 'asignaciones;',len(p),'indicativos')
          PY
      - name: Publicar datos validados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add otros-servicios/prestadores/data/asignaciones.json otros-servicios/prefijos/data/prefijos.json otros-servicios/prefijos/data/fuente.json
          if ! git diff --cached --quiet; then
            git commit -m 'Datos: actualizar asignaciones ENACOM'
            git push
          else
            echo 'Sin cambios de contenido en ENACOM'
          fi
